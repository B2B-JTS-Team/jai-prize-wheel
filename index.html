<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAI Prize Wheel</title>
<link rel="icon" href="data:,">
<script>
// Start loading the prize list immediately (tiny static file on GitHub
// Pages). The ?t= stamp skips the CDN cache so admin edits show up fast.
window.__prizesP = fetch("prizes.json?t=" + Date.now(), { cache: "no-store" })
  .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
window.__prizesP.catch(function(){});
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Only the 2 weights this page uses, loaded without blocking first paint -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=IBM+Plex+Sans+Thai:wght@400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=IBM+Plex+Sans+Thai:wght@400&display=swap"></noscript>
<style>
:root{
  --bg:#F5F6FA;
  --surface:#FFFFFF;
  --surface-2:#EEF0F8;
  --ink:#0D1846;
  --ink-dim:#666F91;
  --accent:#0D1846;
  --accent-2:#E95623;
  --gold:#E95623;
  --border:#E2E5F2;
  --danger:#D64545;
  --brand-gradient:linear-gradient(90deg,#E73A1C,#0D1846);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A1230;
    --surface:#101B3E;
    --surface-2:#172551;
    --ink:#F3F5FF;
    --ink-dim:#9AA4CC;
    --accent:#FF7A50;
    --accent-2:#F2994A;
    --gold:#FDBA74;
    --border:#243466;
    --danger:#F27171;
    --brand-gradient:linear-gradient(90deg,#FF7A50,#4E5FA8);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
  padding-inline:16px;
  padding-block:20px;
  min-height:100%;
  display:flex;
  justify-content:center;
}
.font-display{font-family:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;}

#app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:18px;}

.topbar{display:flex;align-items:center;justify-content:center;gap:10px;}
.brand{display:flex;align-items:center;gap:9px;}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--brand-gradient);
  display:flex;align-items:center;justify-content:center;
  font-family:"Chakra Petch",sans-serif;font-weight:700;color:#fff;font-size:14px;
  flex:none;
}
.brand-text{line-height:1.15;}
.brand-text b{display:block;font-family:"Chakra Petch",sans-serif;font-size:15px;letter-spacing:.02em;}
.brand-text span{display:block;font-size:11px;color:var(--ink-dim);}

#front{display:flex;flex-direction:column;align-items:center;gap:20px;}

.wheel-stage{
  position:relative;
  width:min(78vw,320px);
  aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;
}
.pointer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;z-index:3;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:24px solid var(--gold);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.wheel-ring{
  position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--accent),var(--accent-2),var(--accent));
  opacity:.55;filter:blur(2px);
}
.wheel{
  position:relative;width:100%;height:100%;border-radius:50%;
  border:5px solid var(--surface);
  box-shadow:0 10px 30px rgba(20,10,50,.25),inset 0 0 0 2px var(--border);
  will-change:transform; /* own GPU layer: rotation doesn't repaint the page */
  overflow:hidden;
  background:var(--surface-2);
}
.sector-labels{position:absolute;inset:0;}
.sector-label{
  position:absolute;top:50%;left:50%;
  width:46%;
  transform-origin:0 50%;
  text-align:right;
  padding-right:14px;
  font-family:"Chakra Petch",sans-serif;
  font-weight:700;
  font-size:12.5px;
  line-height:1.15;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  pointer-events:none;
}
.sector-label small{display:block;font-family:"IBM Plex Sans Thai",sans-serif;font-weight:400;font-size:10px;opacity:.85;}
.hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:20%;aspect-ratio:1/1;border-radius:50%;
  background:var(--surface);
  border:3px solid var(--gold);
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  z-index:2;
  display:flex;align-items:center;justify-content:center;
}
.hub-dot{width:34%;aspect-ratio:1/1;border-radius:50%;background:var(--accent);}

.spin-btn{
  font-family:"Chakra Petch",sans-serif;
  font-size:20px;font-weight:700;letter-spacing:.04em;
  color:#fff;
  background:var(--brand-gradient);
  border:none;border-radius:999px;
  padding:15px 46px;
  cursor:pointer;
  box-shadow:0 8px 20px -6px color-mix(in srgb,var(--accent-2) 70%,transparent);
  transition:transform .12s ease,box-shadow .12s ease,filter .15s;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.spin-btn:hover{filter:brightness(1.06);}
.spin-btn:active{transform:translateY(1px) scale(.99);}
.spin-btn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
.spin-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

.spin-note{font-size:12.5px;color:var(--ink-dim);text-align:center;min-height:16px;}

.result-card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1);
}
.result-card[hidden]{display:none;}
@keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.result-swatch{width:44px;height:44px;border-radius:12px;flex:none;}
.result-text b{display:block;font-family:"Chakra Petch",sans-serif;font-size:17px;}
.result-text span{font-size:12.5px;color:var(--ink-dim);}

@media (prefers-reduced-motion: reduce){
  .result-card{animation:none;}
}

#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
.confetti-piece{
  position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;
  animation:fall linear forwards;
}
@keyframes fall{ to{transform:translateY(110vh) rotate(540deg);opacity:.9;} }

.error-note{
  font-size:12.5px;color:var(--danger);text-align:center;
  border:1px solid var(--danger);border-radius:10px;padding:10px 12px;
  background:color-mix(in srgb, var(--danger) 10%, var(--surface));
}
.error-note[hidden]{display:none;}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div class="brand-text">
        <b class="font-display">JAI PRIZE WHEEL</b>
        <span>หมุนวงล้อรับของรางวัล</span>
      </div>
    </div>
  </div>

  <div id="front">
    <div class="wheel-stage">
      <div class="wheel-ring"></div>
      <div class="pointer"></div>
      <div class="wheel" id="wheel">
        <div class="sector-labels" id="sectorLabels"></div>
        <div class="hub"><div class="hub-dot"></div></div>
      </div>
    </div>
    <button class="spin-btn font-display" id="spinBtn" disabled>กำลังโหลด...</button>
    <div class="spin-note" id="spinNote">&nbsp;</div>
    <div class="result-card" id="resultCard" hidden>
      <div class="result-swatch" id="resultSwatch"></div>
      <div class="result-text">
        <b id="resultName">—</b>
        <span id="resultSub">ยินดีด้วย!</span>
      </div>
    </div>
    <div class="error-note" id="errorNote" hidden></div>
  </div>
</div>

<div id="confetti"></div>


<script>
(function(){
  "use strict";

  var els = {
    wheel: document.getElementById("wheel"),
    sectorLabels: document.getElementById("sectorLabels"),
    spinBtn: document.getElementById("spinBtn"),
    spinNote: document.getElementById("spinNote"),
    resultCard: document.getElementById("resultCard"),
    resultSwatch: document.getElementById("resultSwatch"),
    resultName: document.getElementById("resultName"),
    resultSub: document.getElementById("resultSub"),
    confetti: document.getElementById("confetti"),
    errorNote: document.getElementById("errorNote")
  };

  var state = {
    prizes: [],
    spinning: false,
    hasSpun: false,   // 1 spin per page visit — reset only by reloading the page
    currentRotation: 0
  };
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Last good prize list, so the wheel still works if the network drops.
  var CACHE_KEY = "jaiWheelPrizesCache";
  function readCache(){
    try { var p = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); return validPrizes(p) ? p : null; }
    catch(e){ return null; }
  }
  function writeCache(prizes){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(prizes)); } catch(e){}
  }

  function validPrizes(p){
    return Array.isArray(p) && p.length >= 2 && p.every(function(x){
      return x && typeof x.name === "string" && Number(x.weight) >= 0;
    }) && p.some(function(x){ return Number(x.weight) > 0; });
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function showError(msg){
    els.errorNote.textContent = msg;
    els.errorNote.hidden = false;
  }

  // ---------- weighted random draw (in the browser) ----------
  function random01(){
    if (window.crypto && crypto.getRandomValues){
      var a = new Uint32Array(1); crypto.getRandomValues(a);
      return a[0] / 4294967296;            // [0, 1)
    }
    return Math.random();
  }
  function drawIndex(prizes){
    var total = prizes.reduce(function(s, p){ return s + Math.max(0, Number(p.weight) || 0); }, 0);
    var r = random01() * total;
    for (var i = 0; i < prizes.length; i++){
      var w = Math.max(0, Number(prizes[i].weight) || 0);
      if (r < w) return i;
      r -= w;
    }
    // floating-point edge: last prize with weight > 0
    for (var j = prizes.length - 1; j >= 0; j--) if (Number(prizes[j].weight) > 0) return j;
    return 0;
  }

  // ---------- spin motion (requestAnimationFrame, GPU transform only) ----------
  var MAX_V = 1.1;               // top speed, degrees per ms (~3 turns/s)
  var anim = { phase: "idle", v: 0, raf: 0 };

  function setAngle(a){
    state.currentRotation = a;
    els.wheel.style.transform = "rotate(" + a + "deg)";
  }

  function startFreeSpin(){
    cancelAnimationFrame(anim.raf);
    anim.phase = "free"; anim.v = 0;
    var t0 = performance.now(), last = t0;
    function tick(now){
      if (anim.phase !== "free") return;
      var dt = Math.min(now - last, 50); last = now;
      anim.v = Math.min(MAX_V, MAX_V * (now - t0) / 350);  // ramp up over 0.35 s
      setAngle(state.currentRotation + anim.v * dt);
      anim.raf = requestAnimationFrame(tick);
    }
    anim.raf = requestAnimationFrame(tick);
  }

  // Ease-out-cubic over distance D, starting at the current speed.
  function decelerate(D, minMs, maxMs, done){
    cancelAnimationFrame(anim.raf);
    anim.phase = "settle";
    var a0 = state.currentRotation;
    var v0 = Math.max(anim.v, 0.3);
    var dur = Math.min(maxMs, Math.max(minMs, 3 * D / v0));
    var t0 = performance.now();
    function tick(now){
      var p = Math.min(1, (now - t0) / dur);
      setAngle(a0 + D * (1 - Math.pow(1 - p, 3)));
      if (p < 1) anim.raf = requestAnimationFrame(tick);
      else { anim.phase = "idle"; anim.v = 0; if (done) done(); }
    }
    anim.raf = requestAnimationFrame(tick);
  }

  function settleOn(idx, n, done){
    var slice = 360 / n;
    var center = idx * slice + slice / 2;
    var jitter = (random01() - 0.5) * (slice * 0.5);
    var targetMod = (360 - center + jitter + 360) % 360;
    var curMod = ((state.currentRotation % 360) + 360) % 360;
    var turns = reduceMotion ? 0 : 720;                    // at least 2 more turns
    var D = turns + ((targetMod - curMod + 360) % 360);
    decelerate(D, reduceMotion ? 500 : 1800, reduceMotion ? 900 : 4200, done);
  }

  // ---------- wheel rendering ----------
  function renderWheel(prizes){
    var n = prizes.length;
    if (n === 0) return;
    var slice = 360 / n;
    var stops = prizes.map(function(p, i){
      return p.color + " " + (i * slice) + "deg " + ((i + 1) * slice) + "deg";
    });
    els.wheel.style.background = "conic-gradient(" + stops.join(",") + ")";

    els.sectorLabels.innerHTML = "";
    prizes.forEach(function(p, i){
      var center = i * slice + slice / 2;
      var label = document.createElement("div");
      label.className = "sector-label";
      // Label spoke rests at 3 o'clock; subtract 90deg to sit on its sector.
      label.style.transform = "translateY(-50%) rotate(" + (center - 90) + "deg)";
      label.innerHTML = escapeHtml(p.name);
      els.sectorLabels.appendChild(label);
    });
  }

  function burstConfetti(color){
    var colors = [color, "#0D1846", "#E95623", "#1B2B5E"];
    for (var i = 0; i < 26; i++){
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = (Math.random() * 100) + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2 + Math.random() * 1.4) + "s";
      piece.style.opacity = String(0.7 + Math.random() * 0.3);
      els.confetti.appendChild(piece);
      (function(el){ window.setTimeout(function(){ el.remove(); }, 3600); })(piece);
    }
  }

  function showResult(prize){
    els.resultSwatch.style.background = prize.color;
    els.resultName.textContent = prize.name;
    els.resultSub.textContent = "ยินดีด้วย! รับของรางวัลได้ที่บูธ";
    els.resultCard.hidden = false;
    els.spinNote.textContent = "หมุนได้ 1 ครั้งต่อการเข้าหน้า";
    burstConfetti(prize.color);
  }

  // ---------- spin flow (no network: instant) ----------
  function spin(){
    if (state.spinning || state.hasSpun || !state.prizes.length) return;
    state.spinning = true;
    state.hasSpun = true;
    els.spinBtn.disabled = true;
    els.resultCard.hidden = true;
    els.errorNote.hidden = true;
    els.spinNote.textContent = "กำลังหมุน...";

    var idx = drawIndex(state.prizes);
    var winner = state.prizes[idx];

    startFreeSpin();
    window.setTimeout(function(){
      settleOn(idx, state.prizes.length, function(){
        state.spinning = false;
        els.spinBtn.textContent = "หมุนแล้ว";
        showResult(winner);
      });
    }, reduceMotion ? 0 : 600);
  }

  els.spinBtn.addEventListener("click", spin);

  function ready(prizes, note){
    if (state.spinning || state.hasSpun) return;
    state.prizes = prizes;
    renderWheel(prizes);
    els.spinBtn.disabled = false;
    els.spinBtn.textContent = "หมุน!";
    els.spinNote.textContent = note;
  }

  // ---------- boot ----------
  var cached = readCache();
  if (cached) ready(cached, "แตะปุ่มเพื่อหมุนวงล้อ");

  (window.__prizesP || Promise.reject(new Error("no request"))).then(function(data){
    var prizes = data && data.prizes;
    if (!validPrizes(prizes)) throw new Error("prizes.json ไม่ถูกต้อง");
    writeCache(prizes);
    ready(prizes, "แตะปุ่มเพื่อหมุนวงล้อ");
  }).catch(function(err){
    if (cached) return; // keep the saved wheel
    showError("โหลดข้อมูลรางวัลไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้ง (" + (err && err.message ? err.message : "") + ")");
    els.spinBtn.textContent = "หมุน!";
  });
})();
</script>
</body>
</html>
