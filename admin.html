<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAI Prize Wheel — หลังบ้าน</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Only the weights this page uses, loaded without blocking first paint -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap"></noscript>
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#EEF0F8;
  --ink:#0D1846; --ink-dim:#666F91;
  --accent:#0D1846; --accent-2:#E95623; --gold:#E95623;
  --border:#E2E5F2; --danger:#D64545;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A1230; --surface:#101B3E; --surface-2:#172551;
    --ink:#F3F5FF; --ink-dim:#9AA4CC;
    --accent:#FF7A50; --accent-2:#F2994A; --gold:#FDBA74;
    --border:#243466; --danger:#F27171;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
  padding-inline:16px; padding-block:20px; min-height:100%;
  display:flex; justify-content:center;
}
.font-display{font-family:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;}
#app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px;}

.topbar{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(90deg,#E73A1C,#0D1846);
  display:flex;align-items:center;justify-content:center;
  font-family:"Chakra Petch",sans-serif;font-weight:700;color:#fff;font-size:14px;flex:none;
}
.brand-text b{display:block;font-family:"Chakra Petch",sans-serif;font-size:15px;}
.brand-text span{display:block;font-size:11px;color:var(--ink-dim);}

/* ---- login gate ---- */

.section-title{
  font-family:"Chakra Petch",sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);
}

.prize-list{display:flex;flex-direction:column;gap:10px;}
.prize-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.prize-head{display:flex;align-items:center;gap:10px;}
.color-dot{width:16px;height:16px;border-radius:5px;flex:none;border:1px solid rgba(0,0,0,.12);}
.prob-pill{margin-left:auto;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:13px;color:var(--accent);background:var(--surface-2);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;color:var(--ink-dim);}
.field input[type="text"],.field input[type="number"]{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%;
}
.color-row{display:flex;align-items:center;gap:8px;}
.color-row input[type="color"]{width:34px;height:34px;padding:0;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.02em;
  border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid transparent;transition:filter .15s,transform .1s;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--ink-dim);border-color:var(--border);}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-dim);}
.btn-add{
  border:1px dashed var(--border);background:transparent;color:var(--ink-dim);
  border-radius:14px;padding:12px;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:13.5px;
  cursor:pointer;transition:color .15s,border-color .15s;
}
.btn-add:hover{color:var(--accent);border-color:var(--accent);}
.save-status{font-size:12px;color:var(--ink-dim);}
.prize-remove{
  margin-left:auto;background:none;border:none;color:var(--ink-dim);cursor:pointer;
  padding:10px;margin-right:-10px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  min-width:40px;min-height:40px;
}
.prize-remove:hover{color:var(--danger);}
.prize-remove:disabled{opacity:.35;cursor:not-allowed;}
.prize-remove svg{width:15px;height:15px;}
.prize-head .prob-pill{margin-left:0;}


.alert-banner{
  background:color-mix(in srgb, var(--danger) 12%, var(--surface));
  border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:9px 12px;
  font-size:12.5px;font-weight:600;
}
.alert-banner[hidden]{display:none;}
.ok-banner{
  background:color-mix(in srgb, #2E9E6B 12%, var(--surface));
  border:1px solid #2E9E6B;color:#2E9E6B;border-radius:10px;padding:9px 12px;
  font-size:12.5px;font-weight:600;
}
.ok-banner[hidden]{display:none;}
.ok-banner a{color:inherit;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.muted{font-size:12px;color:var(--ink-dim);line-height:1.5;}
.muted a{color:var(--accent);}
.token-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.token-row input[type="password"]{
  flex:1;min-width:180px;font:inherit;font-size:14px;padding:9px 11px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-dim);}
.preview-row{display:flex;align-items:center;gap:14px;}
.mini-wheel{width:84px;height:84px;border-radius:50%;flex:none;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border);}
.odds-list{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12.5px;}
.odds-item{display:flex;align-items:center;gap:8px;}
.odds-item span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.odds-item b{font-family:"Chakra Petch",sans-serif;font-variant-numeric:tabular-nums;}
.sim-out{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
.topbar a.btn{text-decoration:none;}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand-mark">J</div>
    <div class="brand-text">
      <b class="font-display">JAI PRIZE WHEEL</b>
      <span>หลังบ้าน · ตั้งค่าของรางวัลและโอกาสออก</span>
    </div>
    <a class="btn btn-ghost" href="./" target="_blank" rel="noopener" style="margin-left:auto;">เปิดวงล้อ ↗</a>
  </div>

  <div class="alert-banner" id="alertBanner" hidden></div>
  <div class="ok-banner" id="okBanner" hidden></div>

  <div class="section-title">ภาพรวมโอกาสออก</div>
  <div class="card">
    <div class="preview-row">
      <div class="mini-wheel" id="miniWheel"></div>
      <div class="odds-list" id="oddsList"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="simBtn">ทดลองสุ่ม 10,000 ครั้ง</button>
      <span class="sim-out" id="simOut"></span>
    </div>
  </div>

  <div class="section-title">ของรางวัล</div>
  <div class="prize-list" id="prizeList"></div>
  <button class="btn-add" id="addPrizeBtn">+ เพิ่มรางวัลใหม่</button>

  <div class="section-title">บันทึกขึ้นเว็บ</div>
  <div class="card">
    <div class="muted">
      ต้องใช้ GitHub token (ครั้งแรกครั้งเดียว) —
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">สร้าง fine-grained token</a>
      เลือก Repository: <b>jai-prize-wheel</b> เท่านั้น และสิทธิ์ <b>Contents: Read and write</b>
    </div>
    <div class="token-row">
      <input type="password" id="tokenInput" placeholder="github_pat_..." autocomplete="off">
      <label class="check"><input type="checkbox" id="rememberToken" checked> จำไว้ในเครื่องนี้</label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveBtn">บันทึกขึ้นเว็บ</button>
      <button class="btn btn-ghost" id="downloadBtn">ดาวน์โหลด prizes.json</button>
      <button class="btn btn-ghost" id="reloadBtn">โหลดใหม่</button>
      <span class="save-status" id="saveStatus"></span>
    </div>
    <div class="muted" id="sourceNote"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ===== Repo settings (change only if the repo is renamed/moved) =====
  var OWNER  = "B2B-JTS-Team";
  var REPO   = "jai-prize-wheel";
  var BRANCH = "main";          // the branch GitHub Pages publishes
  var FILE   = "prizes.json";
  // ====================================================================
  var API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + FILE;
  var TOKEN_KEY = "jaiWheelGithubToken";
  var PALETTE = ["#0D1846","#E95623","#1B2B5E","#FF8A3D","#233876","#F2994A","#101A3D","#FFB088"];

  var $ = function(id){ return document.getElementById(id); };
  var els = {
    alert: $("alertBanner"), ok: $("okBanner"),
    miniWheel: $("miniWheel"), oddsList: $("oddsList"), simBtn: $("simBtn"), simOut: $("simOut"),
    prizeList: $("prizeList"), addPrizeBtn: $("addPrizeBtn"),
    tokenInput: $("tokenInput"), rememberToken: $("rememberToken"),
    saveBtn: $("saveBtn"), downloadBtn: $("downloadBtn"), reloadBtn: $("reloadBtn"),
    saveStatus: $("saveStatus"), sourceNote: $("sourceNote")
  };
  var state = { prizes: [], sha: null, dirty: false };

  // ---------- helpers ----------
  function escapeHtml(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g, "&quot;"); }
  function b64encodeUtf8(str){
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decodeUtf8(b64){
    var bin = atob(b64.replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function showAlert(msg){ els.ok.hidden = true; els.alert.textContent = msg; els.alert.hidden = false; }
  function showOk(html){ els.alert.hidden = true; els.ok.innerHTML = html; els.ok.hidden = false; }
  function clearBanners(){ els.alert.hidden = true; els.ok.hidden = true; }
  function token(){ return els.tokenInput.value.trim(); }
  function ghHeaders(){
    var h = { "Accept": "application/vnd.github+json" };
    if (token()) h.Authorization = "Bearer " + token();
    return h;
  }
  function totalWeight(){ return state.prizes.reduce(function(s, p){ return s + Math.max(0, Number(p.weight) || 0); }, 0); }
  function pct(p){ var t = totalWeight(); return t > 0 ? (Math.max(0, Number(p.weight) || 0) / t) * 100 : 0; }
  function fmtPct(x){ return (x >= 10 ? x.toFixed(1) : x.toFixed(2)).replace(/\.?0+$/, "") + "%"; }

  // ---------- token (kept only in this browser) ----------
  try { var saved = localStorage.getItem(TOKEN_KEY); if (saved) els.tokenInput.value = saved; } catch(e){}
  function persistToken(){
    try {
      if (els.rememberToken.checked && token()) localStorage.setItem(TOKEN_KEY, token());
      else localStorage.removeItem(TOKEN_KEY);
    } catch(e){}
  }
  els.rememberToken.addEventListener("change", persistToken);

  // ---------- load ----------
  function setPrizes(list, note){
    state.prizes = list.map(function(p, i){
      return { id: String(p.id || ("p" + (i + 1))), name: String(p.name || ""), color: p.color || PALETTE[i % PALETTE.length], weight: Math.max(0, Number(p.weight) || 0) };
    });
    state.dirty = false;
    renderAll();
    els.sourceNote.textContent = note;
  }

  function load(){
    clearBanners();
    els.sourceNote.textContent = "กำลังโหลด...";
    // 1) GitHub API: always the latest committed version + its sha (needed to save)
    return fetch(API + "?ref=" + encodeURIComponent(BRANCH) + "&t=" + Date.now(), { headers: ghHeaders(), cache: "no-store" })
      .then(function(r){
        if (r.status === 404){ state.sha = null; throw new Error("not_found"); }
        if (!r.ok) throw new Error("api_" + r.status);
        return r.json();
      })
      .then(function(j){
        state.sha = j.sha;
        var data = JSON.parse(b64decodeUtf8(j.content));
        setPrizes(data.prizes || [], "โหลดจาก GitHub (" + BRANCH + ") แล้ว");
      })
      .catch(function(err){
        // 2) Fallback: the copy published on this site
        return fetch(FILE + "?t=" + Date.now(), { cache: "no-store" })
          .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(function(data){
            setPrizes(data.prizes || [], "โหลดจากหน้าเว็บ (" + (err.message === "not_found" ? "ยังไม่มีไฟล์บน " + BRANCH : "GitHub API ไม่ตอบ") + ")");
          })
          .catch(function(){
            setPrizes([
              { id: "p1", name: "รางวัลที่ 1", color: PALETTE[0], weight: 50 },
              { id: "p2", name: "รางวัลที่ 2", color: PALETTE[1], weight: 50 }
            ], "ยังไม่มี prizes.json — เริ่มจากค่าตัวอย่าง");
          });
      });
  }

  // ---------- render ----------
  function renderSummary(){
    var n = state.prizes.length, t = totalWeight(), acc = 0, stops = [];
    state.prizes.forEach(function(p){
      var share = t > 0 ? (Math.max(0, Number(p.weight) || 0) / t) * 360 : 360 / n;
      stops.push(p.color + " " + acc + "deg " + (acc + share) + "deg"); acc += share;
    });
    els.miniWheel.style.background = "conic-gradient(" + stops.join(",") + ")";
    els.miniWheel.title = "สัดส่วนตามโอกาสออกจริง (บนวงล้อจริงทุกช่องกว้างเท่ากัน)";
    els.oddsList.innerHTML = state.prizes.map(function(p){
      return '<div class="odds-item"><span class="color-dot" style="background:' + escapeAttr(p.color) + '"></span>' +
        '<span>' + escapeHtml(p.name || "(ไม่มีชื่อ)") + '</span><b>' + fmtPct(pct(p)) + '</b></div>';
    }).join("");
    els.simOut.textContent = "";
  }

  function renderAll(){
    renderSummary();
    els.prizeList.innerHTML = "";
    state.prizes.forEach(function(p, i){
      var card = document.createElement("div");
      card.className = "prize-card";
      card.innerHTML =
        '<div class="prize-head">' +
          '<span class="color-dot" style="background:' + escapeAttr(p.color) + '"></span>' +
          '<span style="font-size:12px;color:var(--ink-dim)">รางวัลที่ ' + (i + 1) + '</span>' +
          '<span class="prob-pill" data-pct="' + i + '">' + fmtPct(pct(p)) + '</span>' +
          '<button type="button" class="prize-remove" data-remove-idx="' + i + '" ' +
            (state.prizes.length <= 2 ? 'disabled title="ต้องมีอย่างน้อย 2 รางวัล"' : 'title="ลบรางวัลนี้"') +
            ' aria-label="ลบรางวัลนี้">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>ชื่อของรางวัล</label>' +
            '<input type="text" data-idx="' + i + '" data-field="name" value="' + escapeAttr(p.name) + '"></div>' +
          '<div class="field"><label>น้ำหนัก (ยิ่งมาก ยิ่งออกบ่อย · 0 = ไม่ออก)</label>' +
            '<input type="number" inputmode="decimal" min="0" step="any" data-idx="' + i + '" data-field="weight" value="' + p.weight + '"></div>' +
        '</div>' +
        '<div class="color-row"><label style="font-size:11px;color:var(--ink-dim)">สี</label>' +
          '<input type="color" data-idx="' + i + '" data-field="color" value="' + escapeAttr(p.color) + '"></div>';
      els.prizeList.appendChild(card);
    });
    els.prizeList.querySelectorAll("input").forEach(function(input){
      input.addEventListener("input", onFieldChange);
    });
    els.prizeList.querySelectorAll("[data-remove-idx]").forEach(function(btn){
      btn.addEventListener("click", function(){ removePrize(Number(btn.getAttribute("data-remove-idx"))); });
    });
  }

  function onFieldChange(e){
    var idx = Number(e.target.getAttribute("data-idx")), field = e.target.getAttribute("data-field");
    var p = state.prizes[idx]; if (!p) return;
    if (field === "name") p.name = e.target.value;
    else if (field === "weight") p.weight = Math.max(0, Number(e.target.value) || 0);
    else if (field === "color"){
      p.color = e.target.value;
      var dot = e.target.closest(".prize-card").querySelector(".color-dot");
      if (dot) dot.style.background = p.color;
    }
    state.dirty = true;
    els.saveStatus.textContent = "มีการแก้ไขที่ยังไม่บันทึก";
    state.prizes.forEach(function(pp, i){
      var pill = els.prizeList.querySelector('[data-pct="' + i + '"]');
      if (pill) pill.textContent = fmtPct(pct(pp));
    });
    renderSummary();
  }

  function addPrize(){
    state.prizes.push({
      id: "p" + Date.now().toString(36),
      name: "รางวัลใหม่ " + (state.prizes.length + 1),
      color: PALETTE[state.prizes.length % PALETTE.length],
      weight: 10
    });
    state.dirty = true; els.saveStatus.textContent = "มีการแก้ไขที่ยังไม่บันทึก";
    renderAll();
  }
  function removePrize(idx){
    if (state.prizes.length <= 2){ showAlert("ต้องมีอย่างน้อย 2 รางวัลบนวงล้อ"); return; }
    state.prizes.splice(idx, 1);
    state.dirty = true; els.saveStatus.textContent = "มีการแก้ไขที่ยังไม่บันทึก";
    renderAll();
  }
  els.addPrizeBtn.addEventListener("click", addPrize);

  // ---------- simulate (same algorithm as the wheel) ----------
  els.simBtn.addEventListener("click", function(){
    var N = 10000, counts = state.prizes.map(function(){ return 0; }), t = totalWeight();
    if (t <= 0){ els.simOut.textContent = "น้ำหนักรวมเป็น 0"; return; }
    var buf = new Uint32Array(N); crypto.getRandomValues(buf);
    for (var k = 0; k < N; k++){
      var r = (buf[k] / 4294967296) * t, i = 0;
      for (; i < state.prizes.length; i++){ var w = Math.max(0, Number(state.prizes[i].weight) || 0); if (r < w) break; r -= w; }
      counts[Math.min(i, state.prizes.length - 1)]++;
    }
    els.simOut.textContent = state.prizes.map(function(p, i){ return (p.name || "?") + " " + counts[i].toLocaleString(); }).join(" · ");
  });

  // ---------- validate + save ----------
  function validate(){
    if (state.prizes.length < 2) return "ต้องมีอย่างน้อย 2 รางวัล";
    for (var i = 0; i < state.prizes.length; i++){
      if (!state.prizes[i].name.trim()) return "รางวัลที่ " + (i + 1) + " ยังไม่มีชื่อ";
    }
    if (totalWeight() <= 0) return "ต้องมีอย่างน้อย 1 รางวัลที่น้ำหนักมากกว่า 0";
    return null;
  }
  function fileText(){
    return JSON.stringify({ prizes: state.prizes.map(function(p){
      return { id: p.id, name: p.name.trim(), color: p.color, weight: p.weight };
    }) }, null, 2) + "\n";
  }

  function fetchSha(){
    return fetch(API + "?ref=" + encodeURIComponent(BRANCH) + "&t=" + Date.now(), { headers: ghHeaders(), cache: "no-store" })
      .then(function(r){ if (r.status === 404) return null; if (!r.ok) throw new Error("api_" + r.status); return r.json().then(function(j){ return j.sha; }); });
  }

  function save(){
    clearBanners();
    var err = validate(); if (err){ showAlert(err); return; }
    if (!token()){ showAlert("ใส่ GitHub token ก่อน (หรือกด “ดาวน์โหลด prizes.json” แล้วอัปโหลดเองบน GitHub)"); els.tokenInput.focus(); return; }
    persistToken();
    els.saveBtn.disabled = true; els.saveStatus.textContent = "กำลังบันทึก...";
    var shaP = state.sha ? Promise.resolve(state.sha) : fetchSha();
    shaP.then(function(sha){
      var body = { message: "Update prizes from admin page", content: b64encodeUtf8(fileText()), branch: BRANCH };
      if (sha) body.sha = sha;
      return fetch(API, { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()), body: JSON.stringify(body) });
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){ return { status: r.status, j: j }; });
    }).then(function(res){
      els.saveBtn.disabled = false;
      if (res.status === 200 || res.status === 201){
        state.sha = res.j.content && res.j.content.sha;
        state.dirty = false;
        els.saveStatus.textContent = "บันทึกแล้ว ✓";
        var link = res.j.commit && res.j.commit.html_url;
        showOk("บันทึกแล้ว ✓ หน้าวงล้อจะใช้ค่าใหม่ภายในประมาณ 1 นาที (หลัง GitHub Pages อัปเดต)" +
          (link ? ' · <a href="' + escapeAttr(link) + '" target="_blank" rel="noopener">ดู commit</a>' : ""));
        return;
      }
      els.saveStatus.textContent = "";
      if (res.status === 401) showAlert("Token ไม่ถูกต้องหรือหมดอายุ");
      else if (res.status === 403 || res.status === 404) showAlert("Token นี้ไม่มีสิทธิ์เขียน repo " + REPO + " (ต้องเลือก repo นี้ + Contents: Read and write)");
      else if (res.status === 409 || res.status === 422) showAlert("ไฟล์บน GitHub ถูกแก้ไขไปแล้วจากที่อื่น — กด “โหลดใหม่” แล้วแก้อีกครั้ง");
      else showAlert("บันทึกไม่สำเร็จ (" + res.status + (res.j && res.j.message ? ": " + res.j.message : "") + ")");
    }).catch(function(e){
      els.saveBtn.disabled = false; els.saveStatus.textContent = "";
      showAlert("บันทึกไม่สำเร็จ: เชื่อมต่อ GitHub ไม่ได้ (" + (e && e.message ? e.message : "") + ")");
    });
  }
  els.saveBtn.addEventListener("click", save);

  els.downloadBtn.addEventListener("click", function(){
    var err = validate(); if (err){ showAlert(err); return; }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([fileText()], { type: "application/json" }));
    a.download = "prizes.json"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });

  els.reloadBtn.addEventListener("click", function(){
    if (state.dirty && !confirm("ทิ้งการแก้ไขที่ยังไม่บันทึก แล้วโหลดใหม่?")) return;
    els.saveStatus.textContent = ""; load();
  });
  window.addEventListener("beforeunload", function(e){ if (state.dirty){ e.preventDefault(); e.returnValue = ""; } });

  load();
})();
</script>
</body>
</html>
